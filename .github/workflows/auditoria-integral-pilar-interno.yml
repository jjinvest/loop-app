name: LOOP AKITEMM - auditoria integral do pilar interno
on:
  push:
    branches:
      - feature/unificar-escritorio-real-20261105
    paths:
      - '.github/workflows/auditoria-integral-pilar-interno.yml'
      - 'test/**'
      - 'src/**'
      - 'scripts/validar-identidade-real-navegador.js'
      - 'scripts/validar-conta-unica-candidato-browser.js'
      - 'scripts/validar-filtros-akitemm-pc-celular-browser.js'
      - 'docs/AUDITORIA_INTERNA_FIM_A_FIM_15NOV2026.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auditoria-integral-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressao-total:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Executar TODOS os arquivos de teste do repositorio (nenhuma suite excluida)
        run: node --test --test-concurrency=4
  dependencias-e-bloqueios:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Nao permitir checkout e dinheiro reais sem homologacao
        env:
          NODE_ENV: production
          LOOP_CLIENTES_LAB: 'NAO'
          LOOP_MODO_SIMULACAO: '0'
        run: node --test test/servidor-publico-bloqueio-laboratorio-marco-zero.test.js test/checkout-publico-cotacao-marco-zero.test.js
      - name: Isolamento operador e cliente, antifraude e contingencia
        run: node --test test/isolamento-operador-gateway-preview.test.js test/backup-conta-unica-restauracao-segura.test.js test/admin-manutencao-reparacao-segura.test.js
  navegacao-completa-pc-celular:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Fluxo REAL identidade / conta / painel / loja PC e celular
        run: node scripts/validar-identidade-real-navegador.js
      - name: Fluxo unificado cliente / loja / conta PC e celular
        if: success() || failure()
        run: node scripts/validar-conta-unica-candidato-browser.js
      - name: Loja / filtros / PDF / administrador / sininho PC e celular
        if: success() || failure()
        run: node scripts/validar-filtros-akitemm-pc-celular-browser.js
      - name: Guardar evidencias de navegacao sem dados pessoais
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-integral-browser-evidencias
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
