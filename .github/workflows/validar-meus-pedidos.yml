name: LOOP - Validar Meus Pedidos no navegador
on:
  push:
    branches: [fix/teste-escrita-catraca-20261014]
    paths:
      - '.github/workflows/validar-meus-pedidos.yml'
      - 'scripts/validar-meus-pedidos-browser.js'
      - 'src/routes/cliente-pedidos-lab.js'
      - 'src/domain/pedidos-titularidade-demo-sqlite.js'
      - 'public/cliente-demo.html'
      - 'test/cliente-pedidos-lab-http.test.js'
      - 'test/links-unicos-loja-escritorio-demo.test.js'
      - 'src/routes/convite-cadastro-laboratorio-demo.js'
      - 'src/laboratorio/convite-cliente-demo.js'
      - 'src/domain/conciliacao-automatica-asaas-sandbox-lab.js'
      - 'src/domain/montagem-integracao-asaas-sandbox-loop-lab.js'
      - 'src/laboratorio/servidor-catalogo.js'
      - 'src/routes/participante-laboratorio-demo.js'
      - 'src/routes/admin-escritorio-demo.js'
      - 'src/domain/operacao-cliente-sqlite-lab.js'
      - 'test/operacao-cliente-sqlite-lab.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/montagem-integracao-asaas-sandbox-loop-lab.test.js'
      - 'test/loja-cliente-sessao-carrinho.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventariar vulnerabilidades das dependencias de execucao
        run: npm audit --omit=dev
      - run: npm test
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validar-meus-pedidos-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meus-pedidos-captura-real
          path: |
            artifacts/meus-pedidos-real.png
            artifacts/posicao-asaas-integrada-pc.png
            artifacts/posicao-asaas-integrada-celular.png
            artifacts/posicoes-dez-integradas-pc.png
          if-no-files-found: warn
