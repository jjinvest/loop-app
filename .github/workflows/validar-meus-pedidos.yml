name: LOOP - Validar Meus Pedidos no navegador
on:
  push:
    branches: [fix/teste-escrita-catraca-20261014]
    paths:
      - '.github/workflows/validar-meus-pedidos.yml'
      - 'scripts/validar-meus-pedidos-browser.js'
      - 'src/routes/cliente-pedidos-lab.js'
      - 'src/domain/pedidos-titularidade-demo-sqlite.js'
      - 'public/cliente-demo.html'
      - 'test/cliente-pedidos-lab-http.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/cliente-pedidos-lab-http.test.js test/pedidos-titularidade-por-titular.test.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validar-meus-pedidos-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meus-pedidos-captura-real
          path: artifacts/meus-pedidos-real.png
          if-no-files-found: warn
