name: LOOP - Identidade real segregada (SEM deploy)
on:
  push:
    branches:
      - feature/unificar-escritorio-real-20261105
    paths:
      - 'src/producao/**'
      - 'src/integracoes/registro-fornecedores.js'
      - 'scripts/iniciar-identidade-real-loop.js'
      - 'scripts/provar-recuperacao-independente-identidade.js'
      - 'test/identidade-real-isolada.test.js'
      - 'test/motor-loop-integrado-identidade.test.js'
      - 'test/motor-loop-concorrencia-e-ciclos.test.js'
      - 'test/indicacoes-cadastro-real.test.js'
      - 'test/eventos-comerciais-loop-sqlite.test.js'
      - 'test/classificacao-comercial-loop-sqlite.test.js'
      - 'test/montar-comercial-sem-homologacao.test.js'
      - 'test/portas-financeiras-modulares.test.js'
      - 'test/plano-roteamento-tres-bancos-lab.test.js'
      - 'src/domain/plano-roteamento-tres-bancos-lab.js'
      - 'src/producao/adaptadores-psp-readonly.js'
      - 'test/adaptadores-psp-readonly.test.js'
      - 'src/producao/conferencia-observacoes-psp.js'
      - 'test/conferencia-observacoes-psp.test.js'
      - 'src/producao/observacoes-psp-ensaio-sqlite.js'
      - 'src/producao/conciliacao-multibancos-ensaio-sqlite.js'
      - 'test/conciliacao-multibancos-ensaio-sqlite.test.js'
      - 'test/observacoes-psp-ensaio-sqlite.test.js'
      - 'test/identidade-real-persistencia.test.js'
      - 'test/api-identidade-real-sem-pagamentos.test.js'
      - 'test/interface-aprovada-identidade-real.test.js'
      - 'test/prontidao-fornecedor-akitemm.test.js'
      - 'test/outbox-fornecedor-real.test.js'
      - 'test/pedido-multidistribuidores-akitemm.test.js'
      - 'test/catalogo-multidistribuidores-akitemm.test.js'
      - 'test/carrinho-cotacao-multidistribuidores.test.js'
      - 'test/backup-identidade-real-restauracao.test.js'
      - 'test/backup-identidade-real-offsite.test.js'
      - 'test/recuperacao-independente-offsite.test.js'
      - 'test/conciliacao-financeira-externa-readonly.test.js'
      - 'test/asaas-producao-readonly.test.js'
      - 'scripts/verificar-asaas-comercial-readonly.js'
      - 'test/agendador-backup-identidade-real.test.js'
      - 'test/meus-pedidos-titular-real.test.js'
      - 'test/controle-economico-loja-sqlite.test.js'
      - 'test/admin-economia-privado-akitemm.test.js'
      - 'test/admin-comercial-integracao-operacional.test.js'
      - 'test/auditoria-admin-manutencao-online.test.js'
      - 'test/manutencao-comercial-online.test.js'
      - 'test/pedido-custo-historico-contador.test.js'
      - 'test/limite-operacoes-identidade-real-sqlite.test.js'
      - 'test/troca-senha-identidade-real-sqlite.test.js'
      - '.github/workflows/identidade-real-segregada.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identidade-real-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identidade-segregada:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Código de conta real deve ser válido
        run: |
          node --check src/producao/eventos-comerciais-loop-sqlite.js
          node --check src/producao/classificacao-comercial-loop-sqlite.js
          node --check src/producao/montar-comercial-sem-homologacao.js
          node --check src/producao/portas-financeiras-modulares.js
          node --check src/producao/adaptadores-psp-readonly.js
          node --check src/producao/conferencia-observacoes-psp.js
          node --check src/producao/observacoes-psp-ensaio-sqlite.js
          node --check src/producao/conciliacao-multibancos-ensaio-sqlite.js
          node --check src/producao/tesouraria-modular-ensaio-sqlite.js
          node --check src/producao/interface-aprovada-contas.js
          node --check src/producao/interface-aprovada-loop.js
          node --check src/producao/servidor-identidade-loop.js
          node --check src/domain/plano-roteamento-tres-bancos-lab.js
          node --check src/producao/motor-loop-integrado-sqlite.js
          node --check src/producao/identidade-cliente-loop-sqlite.js
          node --check src/producao/servidor-identidade-loop.js
          node --check src/producao/interface-aprovada-loop.js
          node --check src/producao/interface-aprovada-contas.js
          node --check src/producao/pedidos-fornecedor-outbox.js
          node --check src/producao/pedidos-comerciais-sqlite.js
          node --check src/producao/controle-economico-loja-sqlite.js
          node --check src/producao/rotas-admin-economia-akitemm.js
          node --check src/producao/interface-admin-comercial-aprovada.js
          node --check src/producao/interface-admin-comercial-client.js
          node --check src/producao/sessao-admin-comercial-sqlite.js
          node --check src/producao/gateway-admin-comercial.js
          node --check src/producao/auditoria-operacional-sqlite.js
          node --check src/producao/manutencao-comercial-sqlite.js
          node --check src/producao/catalogo-multidistribuidores-sqlite.js
          node --check src/producao/cotacoes-multidistribuidores-sqlite.js
          node --check src/producao/backup-identidade-real.js
          node --check src/producao/backup-identidade-offsite.js
          node --check src/producao/recuperacao-independente-offsite.js
          node --check src/producao/conciliacao-financeira-externa-readonly.js
          node --check src/producao/asaas-producao-readonly.js
          node --check scripts/verificar-asaas-comercial-readonly.js
          node --check scripts/provar-recuperacao-independente-identidade.js
          node --check src/producao/agendador-backup-identidade-real.js
          node --check scripts/iniciar-identidade-real-loop.js
      - name: Conta, consentimento, senhas e recuperação
        run: node --test test/identidade-real-isolada.test.js
      - name: Motor interno com três titulares, giro e reinício do banco
        run: node --test test/motor-loop-integrado-identidade.test.js
      - name: Multi-processo, contencao de SQLite, 120 eventos e 20 ciclos
        run: node --test test/motor-loop-concorrencia-e-ciclos.test.js
      - name: Convites imutaveis, indicacoes sem fraude e sem comissoes
        run: node --test test/indicacoes-cadastro-real.test.js
      - name: Evento comercial atomicamente acoplado ao pedido, sem girar LOOP
        run: node --test test/eventos-comerciais-loop-sqlite.test.js
      - name: Cor da venda congelada, verde/cinza/dourado/roxo e sem ativar motor
        run: node --test test/classificacao-comercial-loop-sqlite.test.js
      - name: Conciliação por banco declarado, estorno, duplicação e falha fechada
        run: node --test test/conciliacao-multibancos-ensaio-sqlite.test.js
      - name: Persistencia de observacoes PSP, replay e adulteracao com historico
        run: node --test test/observacoes-psp-ensaio-sqlite.test.js
      - name: Convergencia externa de PSP e Pix sandbox, sem credito ou reenvio
        run: node --test test/conferencia-observacoes-psp.test.js
      - name: Conectores externos isolados Celcoin e Asaas (somente leitura sandbox)
        run: node --test test/adaptadores-psp-readonly.test.js
      - name: Provedores modulares, troca de banco, contingencia e bloqueio de saque
        run: node --test test/portas-financeiras-modulares.test.js test/plano-roteamento-tres-bancos-lab.test.js
      - name: Inicialização comercial protegida, leitura do pedido e bloqueio de PSP
        run: node --test test/montar-comercial-sem-homologacao.test.js
      - name: SQLite de cadastro persiste após reinicialização
        run: node --test test/identidade-real-persistencia.test.js
      - name: API real não abre dinheiro nem aceita CSRF inválido
        run: node --test test/api-identidade-real-sem-pagamentos.test.js
      - name: Limites de login/cadastro/recuperação persistentes e HTTP 429
        run: node --test test/limite-operacoes-identidade-real-sqlite.test.js
      - name: Troca de senha autenticada, concorrente e com CSRF
        run: node --test test/troca-senha-identidade-real-sqlite.test.js
      - name: Reutilização da UI aprovada e guarda da loja
        run: node --test test/interface-aprovada-identidade-real.test.js
      - name: Prontidao de integração do fornecedor, sem pedidos nem frete ficticios
        run: node --test test/prontidao-fornecedor-akitemm.test.js
      - name: Pedidos do parceiro idempotentes e recuperaveis apos falha
        run: node --test test/outbox-fornecedor-real.test.js
      - name: Varios produtos e distribuidores com pagamento unico e remessas isoladas
        run: node --test test/pedido-multidistribuidores-akitemm.test.js
      - name: Catalogo de varios produtos e varios distribuidores sem estoque inventado
        run: node --test test/catalogo-multidistribuidores-akitemm.test.js
      - name: Cotacao de preco estoque frete e uma compra com remessas por distribuidor
        run: node --test test/carrinho-cotacao-multidistribuidores.test.js
      - name: Backup cifrado de identidade e restauração sem reativar sessões
        run: node --test test/backup-identidade-real-restauracao.test.js
      - name: Cópia offsite da identidade cifrada, GET e restauração independente
        run: node --test test/backup-identidade-real-offsite.test.js
      - name: Recuperacao DR fora do servico original com manifesto e chaves
        run: node --test test/recuperacao-independente-offsite.test.js
      - name: Convergencia PSP, lotes bancarios e fornecedores sem abrir financeiro
        run: node --test test/conciliacao-financeira-externa-readonly.test.js
      - name: Asaas comercial GET isolado e bloqueio sem credenciais autorizadas
        run: node --test test/asaas-producao-readonly.test.js
      - name: Abertura real somente após backup externo íntegro e atual
        run: node --test test/agendador-backup-identidade-real.test.js
      - name: Meus Pedidos verdadeiro, sem fuga entre titulares nem venda fictícia
        run: node --test test/meus-pedidos-titular-real.test.js
      - name: Preco de venda custo fornecedor margem e dados do contador
        run: node --test test/controle-economico-loja-sqlite.test.js
      - name: Custos de distribuidores apenas ao administrador autorizado
        run: node --test test/admin-economia-privado-akitemm.test.js
      - name: Custos de compra preservados por pedido, mesmo após mudança no fornecedor
        run: node --test test/pedido-custo-historico-contador.test.js
      - name: Administrador funcional com login independente, produtos, distribuidores e CSV
        run: node --test test/admin-comercial-integracao-operacional.test.js
      - name: Manutenção administrativa sem apagar histórico e com rollback de operação
        run: node --test test/auditoria-admin-manutencao-online.test.js
      - name: Manutenção reversível suspende apenas novas vendas e edição de produtos
        run: node --test test/manutencao-comercial-online.test.js
      - name: Não ativar cadastro real com configuração de laboratório
        env:
          NODE_ENV: production
          LOOP_REAL_CADASTRO_GO: NAO
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {configurar}=require('./scripts/iniciar-identidade-real-loop');
          assert.throws(()=>configurar(process.env),/CADASTRO_REAL_BLOQUEADO_ATE_GO_FORMAL/);
          console.log('CADASTRO_REAL_FALHA_FECHADA=OK');
          NODE
