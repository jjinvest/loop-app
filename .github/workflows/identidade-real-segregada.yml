name: LOOP - Identidade real segregada (SEM deploy)
on:
  push:
    branches:
      - feature/unificar-escritorio-real-20261105
    paths:
      - 'src/producao/**'
      - 'src/integracoes/registro-fornecedores.js'
      - 'scripts/iniciar-identidade-real-loop.js'
      - 'test/identidade-real-isolada.test.js'
      - 'test/identidade-real-persistencia.test.js'
      - 'test/api-identidade-real-sem-pagamentos.test.js'
      - 'test/interface-aprovada-identidade-real.test.js'
      - 'test/prontidao-fornecedor-akitemm.test.js'
      - 'test/outbox-fornecedor-real.test.js'
      - 'test/pedido-multidistribuidores-akitemm.test.js'
      - 'test/catalogo-multidistribuidores-akitemm.test.js'
      - 'test/carrinho-cotacao-multidistribuidores.test.js'
      - 'test/backup-identidade-real-restauracao.test.js'
      - 'test/backup-identidade-real-offsite.test.js'
      - 'test/agendador-backup-identidade-real.test.js'
      - 'test/meus-pedidos-titular-real.test.js'
      - 'test/limite-operacoes-identidade-real-sqlite.test.js'
      - 'test/troca-senha-identidade-real-sqlite.test.js'
      - '.github/workflows/identidade-real-segregada.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identidade-real-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identidade-segregada:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Código de conta real deve ser válido
        run: |
          node --check src/producao/identidade-cliente-loop-sqlite.js
          node --check src/producao/servidor-identidade-loop.js
          node --check src/producao/interface-aprovada-loop.js
          node --check src/producao/interface-aprovada-contas.js
          node --check src/producao/pedidos-fornecedor-outbox.js
          node --check src/producao/pedidos-comerciais-sqlite.js
          node --check src/producao/catalogo-multidistribuidores-sqlite.js
          node --check src/producao/cotacoes-multidistribuidores-sqlite.js
          node --check src/producao/backup-identidade-real.js
          node --check src/producao/backup-identidade-offsite.js
          node --check src/producao/agendador-backup-identidade-real.js
          node --check scripts/iniciar-identidade-real-loop.js
      - name: Conta, consentimento, senhas e recuperação
        run: node --test test/identidade-real-isolada.test.js
      - name: SQLite de cadastro persiste após reinicialização
        run: node --test test/identidade-real-persistencia.test.js
      - name: API real não abre dinheiro nem aceita CSRF inválido
        run: node --test test/api-identidade-real-sem-pagamentos.test.js
      - name: Limites de login/cadastro/recuperação persistentes e HTTP 429
        run: node --test test/limite-operacoes-identidade-real-sqlite.test.js
      - name: Troca de senha autenticada, concorrente e com CSRF
        run: node --test test/troca-senha-identidade-real-sqlite.test.js
      - name: Reutilização da UI aprovada e guarda da loja
        run: node --test test/interface-aprovada-identidade-real.test.js
      - name: Prontidao de integração do fornecedor, sem pedidos nem frete ficticios
        run: node --test test/prontidao-fornecedor-akitemm.test.js
      - name: Pedidos do parceiro idempotentes e recuperaveis apos falha
        run: node --test test/outbox-fornecedor-real.test.js
      - name: Varios produtos e distribuidores com pagamento unico e remessas isoladas
        run: node --test test/pedido-multidistribuidores-akitemm.test.js
      - name: Catalogo de varios produtos e varios distribuidores sem estoque inventado
        run: node --test test/catalogo-multidistribuidores-akitemm.test.js
      - name: Cotacao de preco estoque frete e uma compra com remessas por distribuidor
        run: node --test test/carrinho-cotacao-multidistribuidores.test.js
      - name: Backup cifrado de identidade e restauração sem reativar sessões
        run: node --test test/backup-identidade-real-restauracao.test.js
      - name: Cópia offsite da identidade cifrada, GET e restauração independente
        run: node --test test/backup-identidade-real-offsite.test.js
      - name: Abertura real somente após backup externo íntegro e atual
        run: node --test test/agendador-backup-identidade-real.test.js
      - name: Meus Pedidos verdadeiro, sem fuga entre titulares nem venda fictícia
        run: node --test test/meus-pedidos-titular-real.test.js
      - name: Não ativar cadastro real com configuração de laboratório
        env:
          NODE_ENV: production
          LOOP_REAL_CADASTRO_GO: NAO
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {configurar}=require('./scripts/iniciar-identidade-real-loop');
          assert.throws(()=>configurar(process.env),/CADASTRO_REAL_BLOQUEADO_ATE_GO_FORMAL/);
          console.log('CADASTRO_REAL_FALHA_FECHADA=OK');
          NODE
