name: LOOP - Prévia protegida de Escritórios
on:
  push:
    branches:
      - feature/escritorio-preview-protegido-20261105
      - feature/unificar-escritorio-real-20261105
    paths:
      - 'scripts/servidor-escritorio-preview-railway.js'
      - 'test/servidor-escritorio-preview-railway.test.js'
      - 'test/isolamento-operador-gateway-preview.test.js'
      - 'src/domain/equipe-candidata-sqlite.js'
      - 'src/domain/endereco-entrega-ensaio-sqlite.js'
      - 'test/endereco-entrega-loja-candidato.test.js'
      - 'src/domain/conta-unica-candidata-sqlite.js'
      - 'src/adapters/email-recuperacao-resend.js'
      - 'test/recuperacao-senha-candidata.test.js'
      - 'test/recuperacao-senha-multi-instancia.test.js'
      - 'src/candidato/servidor-loja-escritorio-candidato.js'
      - 'src/domain/motor-conta-unica-ensaio-sqlite.js'
      - 'test/motor-conta-unica-ensaio-sqlite.test.js'
      - 'src/domain/plano-posicoes-compra-akitemm.js'
      - 'test/plano-posicoes-compra-akitemm.test.js'
      - 'test/asaas-motor-automatico-sandbox-candidato.test.js'
      - 'test/asaas-vinculo-motor-recuperacao-candidato.test.js'
      - 'src/domain/prepedidos-checkout-staging-sqlite.js'
      - 'src/routes/prepedidos-checkout-staging.js'
      - 'test/prepedidos-checkout-staging-fluxo-unico.test.js'
      - 'src/integracoes/registro-fornecedores.js'
      - 'test/registro-fornecedores-frete.test.js'
      - 'src/domain/ponte-prepedido-asaas-sandbox-staging.js'
      - 'src/domain/auditoria-integridade-motor-candidato-sqlite.js'
      - 'scripts/backup-criptografado-checkout-staging.js'
      - 'test/backup-conta-unica-restauracao-segura.test.js'
      - 'test/conta-unica-login-concorrente-regressao.test.js'
      - 'test/cadastro-indicacao-atomicidade-sqlite.test.js'
      - 'test/cadastro-indicacao-rejeicao-http.test.js'
      - 'test/troca-senha-conta-unica-candidata.test.js'
      - 'test/preview-unificacao-psp-webhook.test.js'
      - 'src/domain/agendador-conciliacao-asaas-sandbox.js'
      - 'src/domain/agendador-backup-offsite-railway-lab.js'
      - 'src/domain/s3-url-assinada-backup-lab.js'
      - 'test/agendador-backup-offsite-railway-lab.test.js'
      - 'test/agendador-conciliacao-asaas-sandbox.test.js'
      - 'scripts/provar-restauracao-sqlite-unificado-lab.js'
      - 'test/provar-restauracao-sqlite-unificado-lab.test.js'
      - 'test/auditoria-cobertura-lotes-akitemm.test.js'
      - 'src/domain/auditoria-cobertura-lotes-akitemm.js'
      - 'src/candidato/escritorio-admin-candidato-ui.html'
      - 'src/candidato/escritorio-admin-candidato-ui.js'
      - 'test/motor-conta-unica-ensaio-sqlite.test.js'
      - 'src/candidato/checkout-candidato-ui.html'
      - 'src/candidato/checkout-candidato-ui.js'
      - 'src/candidato/escritorio-cliente-integrado.css'
      - 'test/grade-posicoes-ensaios-unificada.test.js'
      - 'src/laboratorio/loop-03-shell.css'
      - 'src/laboratorio/loja-cliente-demo.html'
      - 'src/laboratorio/loja-cliente-demo.js'
      - 'src/laboratorio/loja-cliente-demo.css'
      - 'test/filtros-cor-loja-candidato.test.js'
      - 'src/routes/admin-catalogo-laboratorio.js'
      - 'src/domain/novidades-loja-candidato-sqlite.js'
      - 'src/domain/akitemm-config-loja-demo-sqlite.js'
      - 'test/akitemm-config-loja-demo.test.js'
      - 'test/config-loja-candidato-integrado.test.js'
      - 'test/novidades-loja-candidato.test.js'
      - 'src/candidato/escritorio-admin-candidato-ui.css'
      - 'test/tabuleiro-circular-cliente-ui.test.js'
      - 'test/vitrine-aprovada-candidato.test.js'
      - 'test/simulador-qualificacao-candidato.test.js'
      - 'test/missoes-operacionais-candidato.test.js'
      - 'src/domain/sinalizacao-vitrine-candidato-sqlite.js'
      - 'src/domain/simulador-qualificacao-carrinho-candidato.js'
      - 'src/candidato/vitrine-aprovada-candidato.js'
      - 'src/candidato/escritorio-admin-candidato-ui.html'
      - 'src/laboratorio/checkout-staging-ui.css'
      - 'scripts/validar-conta-unica-candidato-browser.js'
      - '.github/workflows/preview-escritorio-protegido.yml'
  workflow_dispatch:
    inputs:
      suite_integral:
        description: 'Executar a suite geral de regressao antes do marco de liberacao'
        type: boolean
        default: false
# Um unico candidato de homologacao por branch: commits posteriores
# substituem execucoes obsoletas, sem repetir uma suite inteira em paralelo.
concurrency:
  group: preview-escritorio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: node --check scripts/servidor-escritorio-preview-railway.js
      - run: node --check src/domain/agendador-conciliacao-asaas-sandbox.js
      - run: node --check src/domain/s3-url-assinada-backup-lab.js
      - run: node --check src/domain/agendador-backup-offsite-railway-lab.js
      - run: node --test test/agendador-backup-offsite-railway-lab.test.js
      - run: node --test test/agendador-conciliacao-asaas-sandbox.test.js
      - run: node --check test/servidor-escritorio-preview-railway.test.js
      - run: node --check src/domain/equipe-candidata-sqlite.js
      - run: node --check src/candidato/servidor-loja-escritorio-candidato.js
      - run: node --check src/candidato/checkout-candidato-ui.js
      - run: node --check src/domain/motor-conta-unica-ensaio-sqlite.js
      - run: node --test test/motor-conta-unica-ensaio-sqlite.test.js
      - run: node --check src/domain/plano-posicoes-compra-akitemm.js
      - run: node --check src/domain/auditoria-cobertura-lotes-akitemm.js
      - run: node --check scripts/provar-restauracao-sqlite-unificado-lab.js
      - run: node --test test/provar-restauracao-sqlite-unificado-lab.test.js
      - run: node --check src/candidato/escritorio-admin-candidato-ui.js
      - name: Novidades no admin e na loja original, imagens e isolamento
        run: node --test test/novidades-loja-candidato.test.js
      - run: node --test test/akitemm-config-loja-demo.test.js
      - name: Banners e suporte da loja no mesmo banco e administrador
        run: node --test test/config-loja-candidato-integrado.test.js
      - run: node --test test/servidor-escritorio-preview-railway.test.js
      - run: node --check src/adapters/email-recuperacao-resend.js
      - run: node --check src/domain/conta-unica-candidata-sqlite.js
      - run: node --test test/recuperacao-senha-candidata.test.js
      - run: node --test test/recuperacao-senha-multi-instancia.test.js
      - run: node --test test/registro-fornecedores-frete.test.js
      - run: node --test test/prepedidos-checkout-staging-fluxo-unico.test.js
      - run: node --test test/asaas-vinculo-motor-recuperacao-candidato.test.js
      - run: node --test test/conta-unica-login-concorrente-regressao.test.js
      - run: node --test test/cadastro-indicacao-atomicidade-sqlite.test.js
      - run: node --test test/cadastro-indicacao-rejeicao-http.test.js
      - run: node --test test/backup-conta-unica-restauracao-segura.test.js
      - run: node --test test/asaas-motor-automatico-sandbox-candidato.test.js
      - run: node --check src/domain/auditoria-integridade-motor-candidato-sqlite.js
      # Cada fluxo tem limite proprio: diagnostica o bloqueio com precisão
      # e evita repetir a suite integral ou deixar um processo pendurado.
      - name: Identidade unica loja e escritorio
        timeout-minutes: 3
        run: node --test test/loja-escritorio-conta-unica-candidata.test.js
      - name: Troca de senha e revogacao de sessoes
        timeout-minutes: 3
        run: node --test test/troca-senha-conta-unica-candidata.test.js
      - name: Isolamento do operador no gateway
        timeout-minutes: 3
        run: node --test test/isolamento-operador-gateway-preview.test.js
      - name: Tres titulares e privacidade horizontal
        timeout-minutes: 3
        run: node --test test/ensaio-tres-clientes-acesso-unificado-preview.test.js
      - name: Webhook e unica base de dados
        timeout-minutes: 3
        run: node --test test/preview-unificacao-psp-webhook.test.js
      - name: Pagamento sandbox posicao entrega escritorio
        timeout-minutes: 4
        run: node --test test/candidato-psp-posicao-entrega-escritorio-unificados.test.js
      - name: Indicacao e catraca com eventos validados
        timeout-minutes: 4
        run: node --test test/fluxo-indicacao-compra-sandbox-tabuleiro.test.js
      - name: Metas e lotes do circuito
        timeout-minutes: 3
        run: node --test test/meta-lotes-catraca-loop.test.js
      - name: Grade responsiva de posicoes
        timeout-minutes: 3
        run: node --test test/grade-posicoes-ensaios-unificada.test.js
      # Suite integral permanece obrigatoria antes de liberar versao; somente
      # workflow_dispatch com opt-in para nao duplicar auditoria em cada push.
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite_integral == true }}
        run: node --test --test-concurrency=8
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validar-conta-unica-candidato-browser.js
      - name: Guardar capturas reais da mesma interface no PC e celular
        uses: actions/upload-artifact@v4
        with:
          name: capturas-escritorio-cliente-pc-celular
          path: |
            artifacts/conta-unica-candidato-pc.png
            artifacts/conta-unica-candidato-celular.png
          if-no-files-found: error
          retention-days: 20
