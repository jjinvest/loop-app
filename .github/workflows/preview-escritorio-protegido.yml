  workflow_dispatch:
    inputs:
      suite_integral:
        description: 'Executar a suite geral de regressao antes do marco de liberacao'
        type: boolean
        default: false
# Um unico candidato de homologacao por branch: commits posteriores
# substituem execucoes obsoletas, sem repetir uma suite inteira em paralelo.
concurrency:
  group: preview-escritorio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: node --check scripts/servidor-escritorio-preview-railway.js
      - run: node --check src/domain/agendador-conciliacao-asaas-sandbox.js
      - run: node --check src/domain/s3-url-assinada-backup-lab.js
      - run: node --check src/domain/agendador-backup-offsite-railway-lab.js
      - run: node --test test/agendador-backup-offsite-railway-lab.test.js
      - run: node --test test/agendador-conciliacao-asaas-sandbox.test.js
      - run: node --check test/servidor-escritorio-preview-railway.test.js
      - run: node --check src/domain/equipe-candidata-sqlite.js
      - run: node --check src/candidato/servidor-loja-escritorio-candidato.js
      - name: Verificar modulo unico entre laboratorio e identidade
        run: node --check src/shared/visor-catraca.js && node --test test/visor-catraca-unico.test.js test/tabuleiro-visual-unico.test.js test/interface-aprovada-identidade-real.test.js test/historico-pedidos-sem-teto-e-por-titular.test.js test/historico-comercial-paginado.test.js
      - run: node --check src/candidato/checkout-candidato-ui.js
      - run: node --check src/domain/motor-conta-unica-ensaio-sqlite.js
      - run: node --test test/motor-conta-unica-ensaio-sqlite.test.js
      - run: node --check src/domain/plano-posicoes-compra-akitemm.js
      - run: node --check src/domain/auditoria-cobertura-lotes-akitemm.js
      - run: node --check scripts/provar-restauracao-sqlite-unificado-lab.js
      - run: node --test test/provar-restauracao-sqlite-unificado-lab.test.js
      - run: node --check src/candidato/escritorio-admin-candidato-ui.js
      - name: Pesquisa administrativa real e isolamento do operador
        run: node --test test/escritorio-admin-pesquisa-conectada.test.js
      - name: Departamentos operacionais e fontes integradas do SQLite
        run: node --test test/escritorio-admin-operacoes-unificadas.test.js
      - name: Loja unica com PDF foto video 30s e avaliacoes de comprador
        run: node --test test/loja-upload-real-pdf-foto-video-avaliacoes-unificados.test.js
      - name: Verificacao do livro de luzes e custos congelados
        run: node --check src/domain/livro-luzes-financeiras-candidato-sqlite.js && node --check src/candidato/vitrine-aprovada-candidato.js
      - name: Teste da venda R$500 e destinos Banco Inter / Mercado Pago / reserva sem Pix
        run: node --test test/plano-roteamento-tres-bancos-lab.test.js test/celcoin-fluxo-sandbox-lab.test.js
      - name: Prova Celcoin Sandbox OAuth apenas GET sem dinheiro
        run: node --test test/celcoin-sandbox-prova-readonly.test.js
      - name: Persistencia Celcoin Mock, rollback e idempotencia entre reinicios
        run: node --test test/celcoin-historico-mock-sqlite.test.js
      - name: Regra restrita de douradas e cofre exclusivo, sem consumir reserva
        run: node --test test/dourada-manual-auditoria-pontas-loop-v6.test.js test/disponibilidade-caixa2-integracao-v6.test.js
      - run: node --check src/domain/estado-simulacao.js
      - name: Seis eventos ao cofre dourado e conciliacao contabil dos aportes
        run: node --test test/caixa-douradas-desistentes-loop.test.js test/quarto-cofre-douradas-mesmo-giro-v6.test.js test/prelancamento-cofres-separados-v6.test.js test/financeiro-admin-demo.test.js test/conciliacao-cofres-bloqueio-v6.test.js test/marco-zero-integridade-provisoes-lab.test.js
      - name: Novidades no admin e na loja original, imagens e isolamento
        run: node --test test/novidades-loja-candidato.test.js
      - run: node --test test/akitemm-config-loja-demo.test.js
      - name: Banners e suporte da loja no mesmo banco e administrador
        run: node --test test/config-loja-candidato-integrado.test.js
      - run: node --test test/servidor-escritorio-preview-railway.test.js
      - run: node --check src/adapters/email-recuperacao-resend.js
      - run: node --check src/domain/conta-unica-candidata-sqlite.js
      - run: node --test test/recuperacao-senha-candidata.test.js
      - run: node --test test/recuperacao-senha-multi-instancia.test.js
      - run: node --test test/registro-fornecedores-frete.test.js
      - run: node --test test/prepedidos-checkout-staging-fluxo-unico.test.js
      - run: node --test test/asaas-vinculo-motor-recuperacao-candidato.test.js
      - run: node --test test/conta-unica-login-concorrente-regressao.test.js
      - run: node --test test/cadastro-indicacao-atomicidade-sqlite.test.js
      - run: node --test test/cadastro-indicacao-rejeicao-http.test.js
      - run: node --test test/backup-conta-unica-restauracao-segura.test.js
      - run: node --test test/asaas-motor-automatico-sandbox-candidato.test.js
      - run: node --test test/webhook-antecipado-monitor-integrado.test.js test/diagnosticar-asaas-motor-preview-readonly.test.js
      - name: Recuperacao conservadora de checkpoints PSP sem tempo valido
        run: node --test test/recuperacao-automatica-reconsulta-interrompida-sandbox.test.js
      - run: node --test test/webhook-idempotencia-multiconexao-sqlite.test.js
      - run: node --test test/webhook-sigkill-rollback-sqlite.test.js
      - name: Jornada conjunta HTTP concorrente e reinicio com catraca
        timeout-minutes: 4
        run: node --test test/jornada-conjunta-http-concorrencia-reinicio-motor.test.js
      - run: node --test test/admin-manutencao-reparacao-segura.test.js
      - run: node --test test/carga-webhook-400-avisos-multiconexao.test.js
      - run: node --test test/sonda-manutencao-admin-https.test.js
      - run: node --check src/domain/auditoria-integridade-motor-candidato-sqlite.js
      # Cada fluxo tem limite proprio: diagnostica o bloqueio com precisão
      # e evita repetir a suite integral ou deixar um processo pendurado.
      - name: Identidade unica loja e escritorio
        timeout-minutes: 3
        run: node --test test/loja-escritorio-conta-unica-candidata.test.js
      - name: Troca de senha e revogacao de sessoes
        timeout-minutes: 3
        run: node --test test/troca-senha-conta-unica-candidata.test.js
      - name: Isolamento do operador no gateway
        timeout-minutes: 3
        run: node --test test/isolamento-operador-gateway-preview.test.js
      - name: Tres titulares e privacidade horizontal
        timeout-minutes: 3
        run: node --test test/ensaio-tres-clientes-acesso-unificado-preview.test.js
      - name: Webhook e unica base de dados
        timeout-minutes: 3
        run: node --test test/preview-unificacao-psp-webhook.test.js
      - name: Pagamento sandbox posicao entrega escritorio
        timeout-minutes: 4
        run: node --test test/candidato-psp-posicao-entrega-escritorio-unificados.test.js
      - name: Indicacao e catraca com eventos validados
        timeout-minutes: 4
        run: node --test test/fluxo-indicacao-compra-sandbox-tabuleiro.test.js
      - name: Metas e lotes do circuito
        timeout-minutes: 3
        run: node --test test/meta-lotes-catraca-loop.test.js
      - name: Grade responsiva de posicoes
        timeout-minutes: 3
        run: node --test test/grade-posicoes-ensaios-unificada.test.js
      # Regressao completa: manual com opt-in ou commit intencional marcado.
      # A suite NAO roda em push comum; [suite-integral] ativa um check-up.
      - if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite_integral == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[suite-integral]')) }}
        name: Check-up integral de todos os testes Node
        timeout-minutes: 12
        run: node --test --test-concurrency=8
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validar-conta-unica-candidato-browser.js
      - name: Navegacao da identidade definitiva em PC/celular sem checkout
        run: node scripts/validar-identidade-real-navegador.js
      - name: Guardar capturas reais da mesma interface no PC e celular
        uses: actions/upload-artifact@v4
        with:
          name: capturas-escritorio-cliente-pc-celular
          path: |
            artifacts/conta-unica-candidato-pc.png
            artifacts/conta-unica-candidato-celular.png
            artifacts/identidade-real-escritorio-pc.png
            artifacts/identidade-real-escritorio-celular.png
            artifacts/identidade-real-loja-pc.png
            artifacts/identidade-real-loja-celular.png
            artifacts/identidade-real-admin-pc.png
            artifacts/identidade-real-admin-celular.png
          if-no-files-found: error
          retention-days: 20
