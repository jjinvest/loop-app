name: LOOP - Prévia protegida de Escritórios
on:
  push:
    branches:
      - feature/escritorio-preview-protegido-20261105
      - feature/unificar-escritorio-real-20261105
    paths:
      - 'scripts/servidor-escritorio-preview-railway.js'
      - 'test/servidor-escritorio-preview-railway.test.js'
      - 'src/domain/equipe-candidata-sqlite.js'
      - 'src/domain/conta-unica-candidata-sqlite.js'
      - 'src/adapters/email-recuperacao-resend.js'
      - 'test/recuperacao-senha-candidata.test.js'
      - 'src/candidato/servidor-loja-escritorio-candidato.js'
      - 'src/candidato/checkout-candidato-ui.html'
      - 'src/candidato/checkout-candidato-ui.js'
      - 'src/candidato/escritorio-cliente-integrado.css'
      - 'test/grade-posicoes-ensaios-unificada.test.js'
      - 'src/laboratorio/loop-03-shell.css'
      - 'src/laboratorio/checkout-staging-ui.css'
      - 'scripts/validar-conta-unica-candidato-browser.js'
      - '.github/workflows/preview-escritorio-protegido.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: node --check scripts/servidor-escritorio-preview-railway.js
      - run: node --check test/servidor-escritorio-preview-railway.test.js
      - run: node --check src/domain/equipe-candidata-sqlite.js
      - run: node --check src/candidato/servidor-loja-escritorio-candidato.js
      - run: node --check src/candidato/checkout-candidato-ui.js
      - run: node --test test/servidor-escritorio-preview-railway.test.js
      - run: node --check src/adapters/email-recuperacao-resend.js
      - run: node --check src/domain/conta-unica-candidata-sqlite.js
      - run: node --test test/recuperacao-senha-candidata.test.js
      - run: npm test
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validar-conta-unica-candidato-browser.js
      - name: Guardar capturas reais da mesma interface no PC e celular
        uses: actions/upload-artifact@v4
        with:
          name: capturas-escritorio-cliente-pc-celular
          path: |
            artifacts/conta-unica-candidato-pc.png
            artifacts/conta-unica-candidato-celular.png
          if-no-files-found: error
          retention-days: 20
